name: Run Python Script

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installs Python on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Installs pandas (and upgrades pip just in case)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # 4. Runs your specific Python script
      - name: Execute Python script
        run: python test_pandas.py
